            answer: "Средства защиты информации (СЗИ) от несанкционированного доступа (НСД) предназначены для предотвращения или существенного затруднения несанкционированного ознакомления, модификации, уничтожения или блокирования информации в автоматизированных системах. Основные возможности включают: 1) Обязательную идентификацию и аутентификацию субъектов и объектов доступа; 2) Разграничение доступа к ресурсам на основе мандатных, дискреционных и ролевых моделей; 3) Регистрацию событий безопасности (аудит) с защитой журналов от модификации; 4) Контроль целостности программно-аппаратной среды и критических данных; 5) Защиту машинных носителей информации и жесткое управление подключением внешних периферийных устройств (USB, порты ввода-вывода); 6) Гарантированную очистку оперативной и внешней памяти при их перераспределении.",

            sourceName: "ГОСТ Р 59795-2021 «Защита информации. Создание автоматизированных систем в защищенном исполнении. Эксплуатационная документация»",

        {

            answer: "Архитектура СЗИ от НСД строится по многоуровневому клиент-серверному или резидентно-модульному принципу. Основные компоненты: 1) Ядро защиты (диспетчер или монитор обращений) — перехватывает все системные вызовы субъектов к объектам и принимает решение о разрешении или блокировке доступа; 2) Подсистема идентификации и аутентификации — проверяет подлинность пользователей до предоставления рабочей среды ОС; 3) База данных политик безопасности — хранит матрицы прав доступа, списки разрешений и конфигурации; 4) Подсистема аудита — осуществляет фоновую регистрацию значимых событий безопасности; 5) Консоль управления (серверная часть) — обеспечивает централизованное администрирование политик, обновление компонентов и мониторинг состояния сети.",

        {

            answer: "Назначение — разграничение входа в систему и обеспечение легитимности субъектов доступа. Различия: Идентификация — процесс распознавания субъекта по его предъявленному уникальному идентификатору (логин, имя учетной записи, номер карты); Аутентификация — процедура проверки подлинности предъявленного идентификатора (проверка пароля, сличение биометрии, проверка электронной подписи). Способы реализации: 1) Знаниевые (пароли, PIN-коды); 2) Предметные (смарт-карты, аппаратные токены JaCarta/Рутокен); 3) Биометрические (отпечатки пальцев, рисунок вен, геометрия лица). Для критически важных систем применяется многофакторная аутентификация (MFA), сочетающая несколько разных способов.",

            answer: "Контроль целостности обеспечивает неизменность, точность и защиту данных от несанкционированного искажения. Контролируемые объекты: исполняемые файлы операционной системы и прикладного ПО, системные библиотеки, конфигурационные файлы, базы данных и критические массивы документов. В качестве эталона выступают предварительно вычисленные и защищенные криптографические контрольные суммы (хеш-образы по ГОСТ Р 34.11-2012) или электронные цифровые подписи. Действия при нарушении: 1) Автоматическая блокировка запуска измененного файла или доступа к объекту; 2) Регистрация критического инцидента в журнале безопасности; 3) Оперативное оповещение администратора информационной безопасности; 4) Автоматическое или ручное восстановление поврежденного объекта из эталонной резервной копии.",
            sourceName: "Федеральный закон от 06.04.2011 № 63-ФЗ «Об электронной подписи»",

        },
        {
            question: "7. Избирательное разграничение доступа к устройствам: принципы и настройка.",
            answer: "Принцип избирательного (дискреционного) доступа к устройствам заключается в явном задании разрешений или запретов для конкретных пользователей или групп на подключение и использование периферийного оборудования (USB-накопители, принтеры, оптические приводы, интерфейсы Bluetooth/Wi-Fi). Настройка в современных СЗИ выполняется через политики безопасности путем создания списков контроля доступа (ACL): 1) Формируются белые (разрешенные) и черные (запрещенные) списки на основе аппаратных идентификаторов (VID, PID, серийный номер); 2) Задаются разрешенные операции (только чтение, чтение и запись, полный запрет); 3) Все попытки подключения неавторизованных устройств перехватываются драйверами СЗИ, автоматически блокируются и протоколируются в системном журнале.",

        {
            question: "9. Полномочное управление доступом: метки конфиденциальности и полномочия пользователей.",
            answer: "Полномочное (мандатное) управление доступом базируется на строгом сопоставлении меток конфиденциальности информационных объектов и уровней допуска (полномочий) субъектов доступа. Каждому документу или файлу присваивается метка секретности (например, «Конфиденциально», «Секретно»), а каждому пользователю — уровень допуска в иерархической структуре организации. Правила доступа регулируются классической моделью Белла-Лападулы: 1) Субъект может читать информацию объекта только в том случае, если его уровень допуска не ниже уровня конфиденциальности объекта (запрет чтения вверх — no read up); 2) Субъект может записывать информацию в объект только тогда, когда уровень конфиденциальности объекта не ниже уровня допуска субъекта (запрет записи вниз — no write down). Это математически исключает утечку защищаемых данных в несанкционированные или открытые сегменты.",

        {

            answer: "Цели обоих процессов направлены на поддержание высокого уровня защищенности системы, однако между ними существуют принципиальные различия. Оперативный мониторинг проводится в режиме реального времени и нацелен на непрерывное наблюдение за текущим состоянием узлов, сети и служб защиты с целью мгновенного выявления аномалий, сбоев или попыток кибератак, а также автоматического пресечения угроз. Аудит безопасности представляет собой периодический или ретроспективный анализ накопленных журналов событий, конфигураций и действий персонала для проверки их соответствия внутренним регламентам и стандартам ИБ, расследования инцидентов и оценки общей эффективности защитных механизмов.",
            sourceName: "Приказ ФСТЭК России от 11.04.2025 № 117",

    const listContainer = document.getElementById('topicsList');
    const searchInput = document.getElementById('searchInput');
    const noResults = document.getElementById('noResults');

    function renderTopics(items) {
        listContainer.innerHTML = '';
        
        if (items.length === 0) {
            noResults.style.display = 'block';
            return;
        }
        
        noResults.style.display = 'none';

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'topic-card';
            
            card.innerHTML = `
                <div class="topic-question">${item.question}</div>
                <div class="topic-answer">
                    <p>${item.answer}</p>
                    <div class="source">
                        <strong>Источник:</strong> <a href="${item.sourceUrl}" target="_blank" rel="noopener noreferrer">${item.sourceName}</a>
                    </div>
                </div>
            `;
            
            card.addEventListener('click', () => {
                card.classList.toggle('open');
            });
            
            listContainer.appendChild(card);
        });
    }

    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        
        const filtered = database.filter(item => {
            const qText = item.question.toLowerCase();
            const aText = item.answer.toLowerCase();
            const sText = item.sourceName.toLowerCase();
            
            return qText.includes(query) || aText.includes(query) || sText.includes(query);
        });
        
        renderTopics(filtered);
    });

    // Отрисовка при первой загрузке страницы
    renderTopics(database);
</script>
