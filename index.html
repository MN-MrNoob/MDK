<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ответы на темы</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #09140e;
            color: #e0ece4;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            color: #4ade80;
        }

        #searchInput {
            width: 100%;
            padding: 14px 18px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #164e2e;
            background-color: #112217;
            color: #ffffff;
            outline: none;
        }

        #searchInput:focus {
            border-color: #4ade80;
        }

        .topic-card {
            background-color: #112217;
            border: 1px solid #1a3a25;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .topic-card:hover {
            border-color: #4ade80;
        }

        .topic-title {
            font-size: 16px;
            font-weight: bold;
            color: #4ade80;
        }

        .topic-answer {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #1a3a25;
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.5;
        }

        .topic-card.open .topic-answer {
            display: block;
        }

        .source {
            margin-top: 8px;
            color: #86efac;
            font-size: 12px;
        }

        #noResults {
            display: none;
            text-align: center;
            color: #888;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ответы на темы</h1>
    <input type="text" id="searchInput" placeholder="Поиск по номеру (например: 1.3.3) или слову...">
    <div id="topicsList"></div>
    <div id="noResults">Ничего не найдено</div>
</div>

<script>
    const database = [
        {
            title: "Тема 2.6.1. Порядок установки и ввода в эксплуатацию средств защиты информации в компьютерных сетях.",
            answer: "Ввод СЗИ в эксплуатацию включает монтаж, настройку параметров безопасности, приемные испытания и аттестацию объекта.",
            source: "ГОСТ РО 0043-003-2012"
        },
        {
            title: "Тема 1.3.3. Понятие уязвимости угрозы. Классификация уязвимостей",
            answer: "Уязвимость — это недостаток или слабое место в ПО, оборудовании или организационных мерах, которое может быть использовано для реализации угрозы.",
            source: "ГОСТ Р 56546-2015"
        },
        {
            title: "Тема 1.2.4. Требования к автоматизированной системе в защищенном исполнении.",
            answer: "Требования включают обеспечение конфиденциальности, целостности и доступности. Этапы создания регулируются ГОСТ 34.601-90.",
            source: "ГОСТ 34.601-90"
        },
        {
            title: "Тема 2.5.6. Обеспечение целостности информационной системы и информации",
            answer: "Обеспечивается контролем неизменности программно-аппаратной среды, использованием хэш-функций и ЭП.",
            source: "Приказ ФСТЭК № 17"
        },
        {
            title: "Тема 2.5.9. Исследование эффективности проектных решений программно-аппаратных средств",
            answer: "Включает инструментальное сканирование уязвимостей и тестирование на проникновение (пентест).",
            source: "ГОСТ Р ИСО/МЭК 15408"
        },
        {
            title: "Тема 2.6.2. Диагностика компонентов систем защиты информации",
            answer: "Диагностика проводится через анализ системных журналов (Syslog/Event Viewer) и встроенные утилиты СЗИ.",
            source: "Методический документ ФСТЭК"
        },
        {
            title: "Тема 2.3.1. Содержание и порядок деятельности персонала по эксплуатации защищенных АС",
            answer: "Персонал обязан соблюдать политику безопасности. Администратор ИБ управляет учетными записями и правами доступа.",
            source: "РД Гостехкомиссии"
        },
        {
            title: "Тема 2.1.1. Анализ информационной инфраструктуры автоматизированной системы",
            answer: "Включает инвентаризацию всех узлов сети, ПО, сетевых потоков и определение периметра защиты.",
            source: "ГОСТ Р ИСО/МЭК 27005"
        },
        {
            title: "Тема 2.5.5. Использование принтеров для печати конфиденциальных документов",
            answer: "Требует учета бумажных носителей, маркировки листов, водяных знаков и журнала печати.",
            source: "РД Гостехкомиссии"
        },
        {
            title: "Тема 1.5.3. Обнаружение (предотвращение) вторжений",
            answer: "Осуществляется через IDS/IPS системы, сканеры безопасности и средства контрольного суммирования.",
            source: "Приказ ФСТЭК № 17"
        }
    ];

    const listContainer = document.getElementById('topicsList');
    const searchInput = document.getElementById('searchInput');
    const noResults = document.getElementById('noResults');

    function render(items) {
        listContainer.innerHTML = '';
        if (items.length === 0) {
            noResults.style.display = 'block';
            return;
        }
        noResults.style.display = 'none';

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'topic-card';
            card.innerHTML = `
                <div class="topic-title">${item.title}</div>
                <div class="topic-answer">
                    ${item.answer}
                    <div class="source">Источник: ${item.source}</div>
                </div>
            `;
            card.onclick = () => card.classList.toggle('open');
            listContainer.appendChild(card);
        });
    }

    searchInput.oninput = function() {
        const query = this.value.toLowerCase().trim();
        const filtered = database.filter(item => 
            item.title.toLowerCase().includes(query) || 
            item.answer.toLowerCase().includes(query) || 
            item.source.toLowerCase().includes(query)
        );
        render(filtered);
    };

    // Первоначальный вывод всех элементов
    render(database);
</script>

</body>
</html>
