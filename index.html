<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поисковая система</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            border-radius: 12px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: #fff;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        .search-input::placeholder {
            color: #666;
        }

        .topics-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .topic-card {
            background-color: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 18px 20px;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .topic-card:hover {
            border-color: #444;
            background-color: #252525;
        }

        .topic-title {
            font-size: 16px;
            font-weight: 600;
            color: #818cf8;
            margin-bottom: 8px;
        }

        .topic-answer {
            font-size: 14px;
            color: #aaa;
            line-height: 1.5;
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #2d2d2d;
        }

        .topic-card.active .topic-answer {
            display: block;
        }

        .topic-card.active {
            border-color: #4f46e5;
            background-color: #222536;
        }

        .source-link {
            display: inline-block;
            margin-top: 8px;
            font-size: 13px;
            color: #6366f1;
            text-decoration: none;
        }

        .source-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск по темам..." oninput="filterTopics()">
    </div>

    <div class="topics-list" id="topicsList"></div>
</div>

        "Тема 2.3.1. Содержание и порядок деятельности персонала по эксплуатации защищенных автоматизированных систем и подсистем безопасности автоматизированных систем. Общие обязанности администратора информационной безопасности автоматизированных систем",

        "Тема 1.4.1. Организационные, правовые, программно-аппаратные, криптографические, технические меры защиты информации в автоматизированных системах",
        "Тема 2.7.1. Основные эксплуатационные документы защищенных автоматизированных систем. Разработка и ведение эксплуатационной документации защищенных автоматизированных систем. Акт ввода в эксплуатацию на автоматизированную систему. Технический паспорт на защищаемую автоматизированную систему.",
        "Тема 1.4.2. Нормативно-правовая база для определения мер защиты информации в автоматизированных информационных системах и требований к ним",
        "Тема 1.2.3. Разработка технического задания на проектирование автоматизированной системы",
        "Тема 1.7.1. Общие требования по защите персональных данных. Состав и содержание организационных и технических мер по защите информационных систем персональных данных. Порядок выбора мер по обеспечению безопасности персональных данных. Требования по защите персональных данных, в соответствии с уровнем защищенности",

        "Тема 1.3.4. Анализ угроз безопасности информации",
        "Тема 2.5.3. Установка и настройка СЗИ от НСД",

        "Тема 2.6.3. Устранение отказов и восстановление работоспособности компонентов систем защиты информации автоматизированных систем",
        "Тема 2.7.2. Оформление основных эксплуатационных документов на автоматизированную систему.",

        "Тема 1.2.2. Задачи и этапы проектирования автоматизированных систем в защищенном исполнении. Методологии проектирования. Организация работ, функции заказчиков и разработчиков.",
        "Тема 1.1.2. Примеры областей применения АИС. Ресурсы в АИС: ввод, обработка, вывод, обратная связь. Требования к АИС: гибкость, надежность, эффективность, безопасность."

    function renderTopics(filteredTopics) {
        const listContainer = document.getElementById('topicsList');
        listContainer.innerHTML = '';

        filteredTopics.forEach((topic, index) => {
            const card = document.createElement('div');
            card.className = 'topic-card';
            
            card.innerHTML = `
                <div class="topic-title">${topic}</div>
                <div class="topic-answer">
                    <p>placeholder: Ответ на данный вопрос пока не добавлен.</p>
                    <a href="#" class="source-link" onclick="event.stopPropagation()">Ссылка на источник (placeholder)</a>
                </div>
            `;

            card.addEventListener('click', () => {
                card.classList.toggle('active');
            });

            listContainer.appendChild(card);
        });
    }

    function filterTopics() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = topics.filter(t => t.toLowerCase().includes(query));
        renderTopics(filtered);
    }

    renderTopics(topics);
</script>

</body>
</html>
