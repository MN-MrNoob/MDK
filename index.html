<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ответы на темы ИБ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #09140e;
            color: #e0ece4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            color: #4ade80;
        }

        #searchInput {
            width: 100%;
            padding: 14px 18px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #164e2e;
            background-color: #112217;
            color: #ffffff;
            outline: none;
        }

        #searchInput:focus {
            border-color: #4ade80;
        }

        .topic-card {
            background-color: #112217;
            border: 1px solid #1a3a25;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .topic-card:hover {
            border-color: #4ade80;
        }

        .topic-title {
            font-size: 16px;
            font-weight: bold;
            color: #4ade80;
            line-height: 1.4;
        }

        .topic-answer {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #1a3a25;
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.6;
        }

        .topic-card.open .topic-answer {
            display: block;
        }

        .source {
            margin-top: 12px;
            font-size: 13px;
            color: #86efac;
        }

        .source a {
            color: #4ade80;
            text-decoration: underline;
        }

        .source a:hover {
            color: #22c55e;
        }

        #noResults {
            display: none;
            text-align: center;
            color: #888;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ответы на темы</h1>
    <input type="text" id="searchInput" placeholder="Поиск по номеру темы (например: 1.3.3) или ключевым словам...">
    <div id="topicsList"></div>
    <div id="noResults">Ничего не найдено по вашему запросу.</div>
</div>

<script>
    const database = [
        {
            title: "Тема 1.2.4. Требования к автоматизированной системе в защищенном исполнении. Работы на стадиях и этапах создания автоматизированных систем в защищенном исполнении. Требования по защите сведений о создаваемой автоматизированной системе.",
            answer: "Создание автоматизированных систем (АС) в защищенном исполнении регламентируется стандартами серии ГОСТ 34.601-90 и руководящими документами ФСТЭК/Гостехкомиссии. Процесс включает основные стадии: 1) Формирование требований к АС (обследование объекта, разработка концепции защиты); 2) Разработка ТЗ (фиксация класса защищенности); 3) Эскизное и техническое проектирование (моделирование угроз, проектирование подсистем ИБ); 4) Рабочая документация; 5) Ввод в действие (пусконаладка, предварительные испытания, аттестация по требованиям безопасности). Требования по защите сведений о самой АС включают строгое разграничение доступа к проектной документации, присвоение грифов конфиденциальности, подписание НДА подрядчиками и предотвращение утечек по техническим каналам.",
            sourceName: "ГОСТ 34.601-90 (КонсультантПлюс)",
            sourceUrl: "https://www.consultant.ru/document/cons_doc_LAW_130386/"
        },
        {
            title: "Тема 1.3.3. Понятие уязвимости угрозы. Классификация уязвимостей.",
            answer: "Уязвимость информационной системы — это недостаток или слабое место в программном, аппаратном или организационном обеспечении, которое может быть преднамеренно или случайно использовано для реализации угрозы безопасности (нарушения конфиденциальности, целостности или доступности). Классификация уязвимостей выполняется по различным признакам: по причинам возникновения (ошибки проектирования, ошибки программирования, недостатки конфигурации), по месту проявления (системное ПО, прикладное ПО, сетевое оборудование, человеческий фактор), а также по уровню риска с использованием международной метрики CVSS (Common Vulnerability Scoring System — от низкого до критического уровня).",
            sourceName: "ГОСТ Р 56546-2015 (Электронный фонд НТД)",
            sourceUrl: "https://docs.cntd.ru/document/1200123838"
        },
        {
            title: "Тема 1.5.3. Обнаружение (предотвращение) вторжений. Контроль (анализ) защищенности информации.",
            answer: "Системы обнаружения и предотвращения вторжений (IDS/IPS) предназначены для постоянного мониторинга сетевого трафика и системных событий на предмет подозрительной или вредоносной активности. Они функционируют на основе сигнатурного анализа (поиск известных шаблонов атак) и эвристического/поведенческого анализа (выявление отклонений от нормального профиля). Контроль и анализ защищенности информации предусматривает комплекс регулярных мероприятий: автоматизированное сканирование уязвимостей (LANSA, XSpider и др.), проведение аудита настроек безопасности, анализ конфигураций сетевого оборудования, анализ журналов аудита и периодическое проведение тестирования на проникновение (пентест).",
            sourceName: "Приказ ФСТЭК России № 17 (Официальный сайт ФСТЭК)",
            sourceUrl: "https://fstec.ru/normotvorchestvo/akty-fstek-rossii/670-prikaz-fstek-rossii-ot-11-fevralya-2013-g-n-17"
        },
        {
            title: "Тема 2.1.1. Анализ информационной инфраструктуры автоматизированной системы и ее безопасности.",
            answer: "Анализ инфраструктуры — это начальный этап построения и аудита системы защиты. Он включает полную инвентаризацию всех компонентов АС (серверы, рабочие станции, сетевые коммутаторы, маршутизаторы, СУБД, прикладные сервисы), определение границ периметра сети и точек внешних подключений. На основе инвентаризации составляются карты потоков данных, классифицируются обрабатываемые ресурсы по степени конфиденциальности, выявляются наиболее критичные узлы и векторы потенциальных атак. По результатам анализа формируется модель нарушителя и модель угроз безопасности информации.",
            sourceName: "ГОСТ Р ИСО/МЭК 27005 (Гарант)",
            sourceUrl: "https://base.garant.ru/70275522/"
        },
        {
            title: "Тема 2.3.1. Содержание и порядок деятельности персонала по эксплуатации защищенных автоматизированных систем и подсистем безопасности.",
            answer: "Деятельность персонала регламентируется комплексом организационно-распорядительных документов (политики ИБ, инструкции, регламенты). Ключевую роль играет Администратор ИБ, в обязанности которого входит: управление правами доступа пользователей, регулярный аудит и анализ системных журналов (Event Logs/Syslog), актуализация антивирусных баз и установка обновлений безопасности, управление ключами и сертификатами, реагирование на инциденты ИБ, резервное копирование и контроль за соблюдением пользователями требований режима защиты информации.",
            sourceName: "РД Гостехкомиссии России (КонсультантПлюс)",
            sourceUrl: "https://www.consultant.ru/document/cons_doc_LAW_130384/"
        },
        {
            title: "Тема 2.5.5. Использование принтеров для печати конфиденциальных документов. Контроль печати.",
            answer: "Печать конфиденциальных документов на принтерах требует строгой организации контроля для предотвращения утечек на бумажных носителях. Ключевые меры включают: маркировку (грифование) распечатанных документов с указанием грифа, даты и исполнителя, учет учетных страниц в журналах печати, использование технологий безопасной печати (Print Release — печать запускается на принтере только после прикладывания личной карты сотрудника или ввода PIN-кода), автоматический учет и блокировку несанкционированной печати через специализированные ПО (DLP-системы), а также регулярную уничтожение бракованных отпечатков в шредерах.",
            sourceName: "Методические документы ФСТЭК России",
            sourceUrl: "https://fstec.ru/tekhnicheskaya-zashchita-informatsii/dokumenty-po-sertifikatsii"
        },
        {
            title: "Тема 2.5.6. Обеспечение целостности информационной системы и информации.",
            answer: "Целостность информации гарантирует её неизменность, полноту и защиту от несанкционированного искажения, уничтожения или подделки. Для этого применяются программные и аппаратные методы: использование электронных цифровых подписей (ЭП), вычисление и постоянный контроль хэш-сумм (CRC, ГОСТ Р 34.11) системных и исполняемых файлов, реализация механизмов замкнутой программной среды (запрет запуска неопознанного ПО), контроль целостности баз данных, а также регулярное создание резервных копий (Backup) с проверкой возможности их быстрого восстановления.",
            sourceName: "Приказ ФСТЭК России № 21 (КонсультантПлюс)",
            sourceUrl: "https://www.consultant.ru/document/cons_doc_LAW_144120/"
        },
        {
            title: "Тема 2.5.9. Исследование эффективности проектных решений программно-аппаратных средств обеспечения защиты информации.",
            answer: "Исследование эффективности проводится с целью подтверждения того, что внедренные СЗИ обеспечивают требуемый уровень защищенности объекта. Оценка включает в себя: инструментальный анализ (сканирование на уязвимости), проведение испытаний подсистем защиты от НСД, анализаторов трафика и МЭ, функциональное тестирование средств аутентификации и разграничения доступа, а также проведение контрольных проверок на соответствие требованиям профилей защиты (Общие критерии оценки безопасности IT). По результатам оформляются протоколы испытаний и заключение о готовности АС.",
            sourceName: "ГОСТ Р ИСО/МЭК 15408 (Общие критерии)",
            sourceUrl: "https://docs.cntd.ru/document/1200103632"
        },
        {
            title: "Тема 2.6.1. Порядок установки и ввода в эксплуатацию средств защиты информации в компьютерных сетях.",
            answer: "Ввод СЗИ в эксплуатацию выполняется в соответствии со строго определенным регламентом: 1) Выполнение подготовительных работ (проверка комплектации, аппаратной совместимости); 2) Монтаж и физическое подключение оборудования (межсетевых экранов, VPN-шлюзов); 3) Установка и конфигурация программной части СЗИ в соответствии с разработанной политикой безопасности; 4) Проведение комплексных приемо-сдаточных испытаний и опытной эксплуатации; 5) Оформление акта ввода в эксплуатацию; 6) Обучение персонала. Далее организуется плановое техническое обслуживание (ТО-1, ТО-2) и ведение эксплуатационного журнала.",
            sourceName: "ГОСТ РО 0043-003-2012 (Техническое обслуживание)",
            sourceUrl: "https://docs.cntd.ru/document/1200100000"
        },
        {
            title: "Тема 2.6.2. Диагностика компонентов систем защиты информации в автоматизированных системах, устранение отказов и восстановление работоспособности.",
            answer: "Диагностика компонентов СЗИ проводится непрерывно и планово. Непрерывная диагностика включает сбор и анализ событий с помощью журналов (Syslog, Event Viewer, SIEM-систем) и отслеживание статусов служб безопасности. При обнаружении отказов или сбоев алгоритм действий следующий: локализация неисправного узла, переключение на резервное оборудование (в отказоустойчивых кластерах), восстановление конфигураций СЗИ из актуальных резервных копий, замена неисправных аппаратных модулей, проведение повторного контроля целостности и тестирование защищенных функций перед возвратом в штатный режим работы.",
            sourceName: "Методический документ ФСТЭК России",
            sourceUrl: "https://fstec.ru/normotvorchestvo/akty-fstek-rossii"
        }
    ];

    const listContainer = document.getElementById('topicsList');
    const searchInput = document.getElementById('searchInput');
    const noResults = document.getElementById('noResults');

    function render(items) {
        listContainer.innerHTML = '';
        if (items.length === 0) {
            noResults.style.display = 'block';
            return;
        }
        noResults.style.display = 'none';

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'topic-card';
            card.innerHTML = `
                <div class="topic-title">${item.title}</div>
                <div class="topic-answer">
                    <p>${item.answer}</p>
                    <div class="source">
                        <strong>Источник:</strong> 
                        <a href="${item.sourceUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();">
                            ${item.sourceName}
                        </a>
                    </div>
                </div>
            `;
            card.onclick = () => card.classList.toggle('open');
            listContainer.appendChild(card);
        });
    }

    searchInput.oninput = function() {
        const query = this.value.toLowerCase().trim();
        const filtered = database.filter(item => 
            item.title.toLowerCase().includes(query) || 
            item.answer.toLowerCase().includes(query) || 
            item.sourceName.toLowerCase().includes(query)
        );
        render(filtered);
    };

    // Отображение всех элементов при загрузке
    render(database);
</script>

</body>
</html>
